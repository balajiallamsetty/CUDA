# Render Blueprint — monorepo (client Vite SPA + Express API + shared)
# IMPORTANT: Root Directory must be the repository root (leave blank in the dashboard).
# Do NOT set Root Directory to `server` — that package is plain JS and has no `build` script.
# Workspace deps (@vignak/shared) also require installing from the repo root.
services:
  - type: web
    name: vignak-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: vignak-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Build-time: absolute API origin for the SPA (e.g. https://vignak-api.onrender.com)
      - key: VITE_API_URL
        sync: false
